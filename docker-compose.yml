services:
  web:
    build:
      context: .
      dockerfile: src/TrustRecruitment.Web/Dockerfile
    container_name: trustrecruitment-web
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MongoDb: mongodb://admin:secret123@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys

  mongodb:
    image: mongo:latest
    container_name: trustrecruitment-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  dataprotection_keys: