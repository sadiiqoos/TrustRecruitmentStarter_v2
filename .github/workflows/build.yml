name: deploy-trustrecruitment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TrustRecruitment.sln

      - name: Build
        run: dotnet build TrustRecruitment.sln --configuration Release --no-restore

      - name: Docker Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -f src/TrustRecruitment.Web/Dockerfile \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/trustrecruitment:${{ github.sha }} .

      - name: Push image
        run: |
          docker push \
          ${{ secrets.AZURE_CONTAINER_REGISTRY }}/trustrecruitment:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/trustrecruitment:${{ github.sha }}